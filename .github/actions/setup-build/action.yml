name: Set up build
description: JDK, Gradle (with wrapper validation and cache) and the Android SDK packages the build needs.

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # Open-source cache based on actions/cache; writes only from the default branch.
        cache-provider: basic

    - name: Install Android SDK packages
      shell: bash
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
          "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
