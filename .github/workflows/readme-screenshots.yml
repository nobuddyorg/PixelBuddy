name: README screenshots

# The README screenshots (#71): PixelBuddy on an emulator with Google's Play Store image, whose real apps give real
# icons. Run it from the Actions tab on a branch; it commits docs/screenshots/ to that branch. On main it pushes a new
# branch instead and links it in the run summary, to open a pull request from. Pull requests that change the
# screenshot test or this workflow run it too.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/readme-screenshots.yml
      - app/src/androidTest/kotlin/io/github/nobuddyorg/pixelbuddy/ReadmeScreenshots.kt

permissions: {}

concurrency:
  group: readme-screenshots-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture on the emulator
    # The screenshots are pushed back, which only works for branches of this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      # The pictures are pulled before Gradle's run ends, since it uninstalls the app afterwards; they are in
      # /data/local/tmp, which the uninstall leaves alone.
      - name: Capture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.0"
          system-image-api-level: "37.0"
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.nobuddyorg.pixelbuddy.ReadmeScreenshots -Pandroid.testInstrumentationRunnerArguments.readmeScreenshots=true
            mkdir -p build/readme-screenshots
            adb pull /data/local/tmp/readme-screenshots/. build/readme-screenshots/

      - name: Show the test log
        if: ${{ !cancelled() }}
        run: grep -rh "ReadmeScreenshots" app/build/outputs/androidTest-results || echo "nothing logged"

      # Half size: the README shows them about 200 px wide; full size would make every refresh a few MB.
      - name: Shrink
        run: |
          command -v mogrify || { sudo apt-get update -q && sudo apt-get install -y -q imagemagick; }
          mogrify -filter Box -resize 50% -strip build/readme-screenshots/*.png
          ls -l build/readme-screenshots

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-screenshots
          path: build/readme-screenshots/*.png
          retention-days: 14
          if-no-files-found: error

  # Separate from the capture, so the build never runs with a token that can push.
  commit:
    name: Commit the screenshots
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme-screenshots
          path: docs/screenshots

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain docs/screenshots)" ]; then
            echo "The screenshots are unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898268+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "README screenshots from the emulator (#71)"
          if [ "$BRANCH" = "${{ github.event.repository.default_branch }}" ]; then
            target="readme-screenshots-${{ github.run_number }}"
            git push origin "HEAD:refs/heads/$target"
            echo "New screenshots on [$target](${{ github.server_url }}/${{ github.repository }}/compare/$BRANCH...$target?expand=1): open a pull request from there." >> "$GITHUB_STEP_SUMMARY"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
            echo "New screenshots committed to $BRANCH." >> "$GITHUB_STEP_SUMMARY"
          fi
