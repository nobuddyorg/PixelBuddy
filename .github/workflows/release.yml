name: Release

# Pushing a tag vX.Y.Z builds, signs and publishes PixelBuddy-vX.Y.Z.apk on GitHub Releases.
# See docs/RELEASING.md for the one-time setup (keystore secrets, protected "release" environment).
#
# Jobs are split so secrets and project code never meet:
#   build   - runs Gradle (and all third-party build code) without any secret, produces an unsigned APK
#   sign    - holds the keystore (environment "release", needs approval), runs no project code
#   publish - attests the signed APK and creates the GitHub Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=$(scripts/version-from-tag.sh "$TAG")" >> "$GITHUB_OUTPUT"

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          # Release builds don't reuse caches written by other workflows.
          cache-disabled: "true"

      - name: Check, test and build release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          ./gradlew spotlessCheck build :koverVerifyUnit
          -Proborazzi.test.verify=true -Ppixelbuddy.versionName="$VERSION"

      - name: APK size budget
        run: scripts/check-apk-size.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read # download the artifact of the build job
    env:
      APK: PixelBuddy-${{ github.ref_name }}.apk
      BUILD_TOOLS: 36.0.0
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk

      - name: Install build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;${BUILD_TOOLS}" > /dev/null

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          "$bt/zipalign" -c -P 16 4 app-release-unsigned.apk
          "$bt/apksigner" sign \
            --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "$APK" app-release-unsigned.apk

      - name: Verify signature (v2 + v3)
        run: |
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          # --min-sdk-version 24 makes apksigner check v2 too (devices on 28+ only check v3).
          "$bt/apksigner" verify --verbose --print-certs --min-sdk-version 24 "$APK" | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          sha256sum "$APK" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: |
            ${{ env.APK }}
            SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # download the artifact of the sign job
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk

      - name: Check checksum
        run: sha256sum --check SHA256SUMS

      # Artifact attestations are free for public repositories.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: PixelBuddy-${{ github.ref_name }}.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" "PixelBuddy-$TAG.apk" SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "PixelBuddy $TAG"
