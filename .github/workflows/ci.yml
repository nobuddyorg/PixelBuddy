name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Format check
        run: ./gradlew spotlessCheck

      # One invocation, so unit tests run once for tests, screenshots and coverage.
      - name: Build, lint, tests, screenshots and coverage
        run: >-
          ./gradlew build :koverXmlReportUnit :koverHtmlReportUnit :koverVerifyUnit :core:pixel-engine:koverVerify :core:search:koverVerify
          -Proborazzi.test.verify=true

      - name: APK size budget
        run: scripts/check-apk-size.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          retention-days: 14
          if-no-files-found: ignore

  outline-prototype:
    name: Outline icon prototype
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        working-directory: tools/icon-outline
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
          .venv/bin/python -m unittest -v
