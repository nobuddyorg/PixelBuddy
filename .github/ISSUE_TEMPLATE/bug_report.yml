name: Bug report
description: Something in PixelBuddy doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go through private reporting instead, see SECURITY.md.
        Please remove personal data (app lists, locations, notifications) from screenshots and logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Long-press …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PixelBuddy version
      description: Settings → About, or the release you installed.
      placeholder: v1.2.3
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Galaxy S24, One UI 9.0 / Android 17
    validations:
      required: true
  - type: textarea
    id: crash-report
    attributes:
      label: Crash report or logs
      description: If PixelBuddy crashed, share the report from Settings → About → Crash reports.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
